name: Build and push prod images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/bredauniversityadsai/2025-26d-fai2-adsai-group-computervision5

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push migrations
        uses: docker/build-push-action@v6
        with:
          context: .
          file: db/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/cv5-migrations:latest
            ${{ env.IMAGE_PREFIX }}/cv5-migrations:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,scope=migrations,mode=max

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/cv5-api:latest
            ${{ env.IMAGE_PREFIX }}/cv5-api:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/cv5-frontend:latest
            ${{ env.IMAGE_PREFIX }}/cv5-frontend:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # Don't trigger Portainer deploy from PR builds, IP unreachable from GH actions runners and would cause confusion with failed deploys on PRs
      # - name: Trigger Portainer webhook
      #   run: |
      #     curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
