name: PyTests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.18"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dev + API requirements
        run: |
          pip install -r requirements/dev.txt
          pip install -r requirements/api.txt

      - name: Install npec_cv package
        run: pip install -e src/npec_cv

      - name: Run pytest with coverage
        env:
          # Required by api.src.config.Settings at import time; the API tests
          # never actually open this connection (the session is overridden).
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
        run: |
          pytest \
            tests/preprocessing \
            tests/inference \
            tests/postprocessing \
            tests/e2e \
            tests/cli \
            tests/api \
            tests/scripts \
            tests/lineage \
            --cov=src/npec_cv \
            --cov=api/src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85
