name: Build check

on:
  pull_request:
    branches: [main]
    # Skip runs that can't affect the build (tweak globs to taste).
    paths:
      - "api/**"
      - "frontend/**"
      - "db/**"
      - "docker-compose.dev.yml"
      - ".env.example"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write   # needed to push/pull the registry buildcache

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image paths must be lowercase; the org/repo may not be.
      - name: Compute lowercase image prefix
        id: img
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Create .env for compose substitution
        run: cp .env.example .env

      - name: Build compose services with registry cache
        uses: docker/bake-action@v5
        with:
          source: .
          files: docker-compose.dev.yml
          set: |
            migrations.cache-from=type=registry,ref=${{ steps.img.outputs.prefix }}/cv5-migrations:devcache
            migrations.cache-to=type=registry,ref=${{ steps.img.outputs.prefix }}/cv5-migrations:devcache,mode=max
            api.cache-from=type=registry,ref=${{ steps.img.outputs.prefix }}/cv5-api:devcache
            api.cache-to=type=registry,ref=${{ steps.img.outputs.prefix }}/cv5-api:devcache,mode=max
            frontend.cache-from=type=registry,ref=${{ steps.img.outputs.prefix }}/cv5-frontend:devcache
            frontend.cache-to=type=registry,ref=${{ steps.img.outputs.prefix }}/cv5-frontend:devcache,mode=max