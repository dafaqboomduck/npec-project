name: Build check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for compose substitution
        run: cp .env.example .env

      - name: Build compose services with layer cache
        uses: docker/bake-action@v5
        with:
          source: .
          files: docker-compose.dev.yml
          set: |
            migrations.cache-from=type=gha,scope=migrations
            migrations.cache-to=type=gha,scope=migrations,mode=max
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,scope=frontend,mode=max