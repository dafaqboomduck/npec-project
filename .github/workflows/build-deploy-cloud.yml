name: Build and deploy cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC federated login to Azure (ACR push + Container App deploy)

env:
  REGISTRY: y2d2025.azurecr.io
  IMAGE_PREFIX: y2d2025.azurecr.io/cv5

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name y2d2025

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile.cloud
          target: cloud
          push: true
          build-args: |
            NPEC_CV_VERSION=${{ vars.NPEC_CV_VERSION }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:latest
            ${{ env.IMAGE_PREFIX }}/api:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=api-cloud
          cache-to: type=gha,scope=api-cloud,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: cloud
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL_CLOUD }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.IMAGE_PREFIX }}/frontend:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=frontend-cloud
          cache-to: type=gha,scope=frontend-cloud,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update -n cv5-api -g buas-y2 \
              --image ${{ env.IMAGE_PREFIX }}/api:sha-${{ needs.build-and-push.outputs.short_sha }}

      - name: Deploy frontend
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update -n cv5-frontend -g buas-y2 \
              --image ${{ env.IMAGE_PREFIX }}/frontend:sha-${{ needs.build-and-push.outputs.short_sha }}