# Alembic configuration for the CV5 database.
#
# Paths here are relative to THIS file's directory (db/). Run migrations with:
#
#     alembic -c db/alembic.ini upgrade head
#
# from the repo root, or:
#
#     alembic upgrade head
#
# from inside db/. Either works.
#
# DATABASE_URL is not set here — env.py reads it from the environment so the
# same config works locally, in Docker, and on Portainer without edits.

[alembic]
# Path to migration scripts. %(here)s is the directory containing this .ini file,
# so this works whether alembic is run from the repo root (`alembic -c db/alembic.ini`)
# or from inside db/ (`alembic ...`).
script_location = %(here)s/alembic

# Template used to generate new migration filenames.
# Format: NNNN_short_description.py where NNNN is a zero-padded revision number.
file_template = %%(rev)s_%%(slug)s

# Timezone for migration timestamps (UTC).
timezone = UTC

# Max length of the slug portion of a filename.
truncate_slug_length = 40

# Revision IDs are short numeric strings (0001, 0002, ...) — easier to read
# in a migration graph than random hex. Alembic will accept any string.

sqlalchemy.url =

[post_write_hooks]
# No post-write hooks for now. Could add black/ruff here if we want
# auto-formatting of generated migrations.

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
