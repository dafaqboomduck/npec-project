# docker-compose.yml — local development stack for the CV5 database layer.
#
# Services:
#   db         Postgres 16 with persistent volume and healthcheck.
#   migrations One-shot. Runs `alembic upgrade head` and exits. Waits for
#              `db` to be healthy before starting (prevents race conditions
#              on cold `docker compose up`).
#
# NOT in this file:
#   - The backend app (separate task)
#   - The frontend (separate task, has its own repo-root directory)
#   - Seed data runner (run manually, see docs/database/running.md)
#
# Usage:
#   docker compose up -d db              # start just Postgres
#   docker compose run --rm migrations   # run migrations, then exit
#   docker compose down                  # stop everything, keep volume
#   docker compose down -v               # also delete the volume (wipes data)
#
# Environment:
#   Reads `.env` automatically (Compose feature, no dotenv library needed).
#   DATABASE_URL inside the compose network uses host `db` (the service name).

services:
  db:
    image: postgres:16
    container_name: cv5-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cv5}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cv5}
      POSTGRES_DB: ${POSTGRES_DB:-cv5}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - cv5_pgdata:/var/lib/postgresql/data
      - ./db/seeds:/seeds:ro
      - ./db/seeds/dev_seed.sql:/docker-entrypoint-initdb.d/dev_seed.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cv5} -d ${POSTGRES_DB:-cv5}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000" # S3-compatible API
      - "9001:9001" # MinIO console (http://localhost:9001)
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrations:
    build:
      context: .
      dockerfile: db/Dockerfile
    container_name: cv5-migrations
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cv5}:${POSTGRES_PASSWORD:-cv5}@db:5432/${POSTGRES_DB:-cv5}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: cv5-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cv5}:${POSTGRES_PASSWORD:-cv5}@db:5432/${POSTGRES_DB:-cv5}
      SECRET_KEY: ${SECRET_KEY:-devsecret}
      USE_MOCK_INFERENCE: ${USE_MOCK_INFERENCE:-true}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-npec-artifacts}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    container_name: cv5-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  cv5_pgdata:
  minio_data:
