[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npec_cv"
version = "0.2.0"
description = "NPEC computer vision pipeline for root detection and measurement"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "NPEC" }]
license = "LicenseRef-Proprietary"
# patchify is vendored under npec_cv.helpers.patchify to avoid stale numpy<2 pins upstream.
dependencies = [
  "tensorflow~=2.20.0",
  "keras~=3.12.0",
  "opencv-contrib-python>=4.10,<4.11",
  "numpy>=1.26,<2.2",
  "scipy~=1.15.0",
  "scikit-image~=0.25.0",
  "networkx~=3.4.0",
  "pandas~=2.3.0",
  "tqdm~=4.67.0",
  "h5py~=3.15.0",
  "Pillow~=12.0.0",
]

[project.optional-dependencies]
cuda = [
  "nvidia-cublas-cu12==12.9.1.4",
  "nvidia-cuda-cupti-cu12==12.9.79",
  "nvidia-cuda-nvcc-cu12==12.9.86",
  "nvidia-cuda-nvrtc-cu12==12.9.86",
  "nvidia-cuda-runtime-cu12==12.9.79",
  "nvidia-cudnn-cu12==9.16.0.29",
  "nvidia-cufft-cu12==11.4.1.4",
  "nvidia-curand-cu12==10.3.10.19",
  "nvidia-cusolver-cu12==11.7.5.82",
  "nvidia-cusparse-cu12==12.5.10.65",
  "nvidia-nccl-cu12==2.28.9",
  "nvidia-nvjitlink-cu12==12.9.86",
]

[tool.setuptools]
packages = [
  "npec_cv",
  "npec_cv.configs",
  "npec_cv.core",
  "npec_cv.exceptions",
  "npec_cv.helpers",
  "npec_cv.inference",
  "npec_cv.models",
]

[tool.setuptools.package-dir]
npec_cv = "."
"npec_cv.configs" = "configs"
"npec_cv.core" = "core"
"npec_cv.exceptions" = "exceptions"
"npec_cv.helpers" = "helpers"
"npec_cv.inference" = "inference"
"npec_cv.models" = "models"

[tool.setuptools.package-data]
npec_cv = ["artifacts/models/*.keras"]
