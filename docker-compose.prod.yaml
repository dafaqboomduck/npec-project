services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cv5_npec_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  migrations:
    image: ghcr.io/bredauniversityadsai/2025-26d-fai2-adsai-group-computervision5/cv5-migrations:latest
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  api:
    image: ghcr.io/bredauniversityadsai/2025-26d-fai2-adsai-group-computervision5/cv5-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      USE_MOCK_INFERENCE: "false"
      USE_DB_STORAGE: "true"
      CORS_ORIGINS: http://194.171.191.226:2025
      NPEC_MASKS_DIR: /tmp/npec_masks
      NPEC_ANNOTATION_MASK_DIR: /tmp/npec_annotation_masks
    ports:
      - "2021:8000"
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  frontend:
    image: ghcr.io/bredauniversityadsai/2025-26d-fai2-adsai-group-computervision5/cv5-frontend:latest
    restart: unless-stopped
    ports:
      - "2022:3000"
    depends_on:
      - api

volumes:
  cv5_npec_pgdata:
    name: cv5_npec_pgdata
