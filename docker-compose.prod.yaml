services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cv5_npec_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "2023:9000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  migrations:
    image: ghcr.io/bredauniversityadsai/2025-26d-fai2-adsai-group-computervision5/cv5-migrations:${SERVICE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
    restart: on-failure

  bootstrap:
    image: ghcr.io/bredauniversityadsai/2025-26d-fai2-adsai-group-computervision5/cv5-api:${SERVICE_TAG:-latest}
    command: [ "python", "-m", "db.bootstrap" ]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BASELINE_MODEL_URI: ${BASELINE_MODEL_URI}
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      - migrations
    restart: "no"

  api:
    image: ghcr.io/bredauniversityadsai/2025-26d-fai2-adsai-group-computervision5/cv5-api:${SERVICE_TAG:-latest}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ "6" ]
              capabilities: [ gpu ]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      USE_MOCK_INFERENCE: "false"
      CORS_ORIGINS: ${CORS_ORIGINS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-npec-artifacts}
      NPEC_MASKS_DIR: /tmp/npec_masks
      NPEC_ANNOTATION_MASK_DIR: /tmp/npec_annotation_masks
      BASELINE_MODEL_URI: ${BASELINE_MODEL_URI}
      NPEC_ARTIFACT_DIR: ${NPEC_ARTIFACT_DIR}
      # Run inference in a warm worker process that keeps the models loaded
      # across requests. The worker is torn down after IDLE_TIMEOUT_MINUTES with
      # no inference, releasing its GPU memory back to the driver (TensorFlow
      # never frees VRAM within a live process); the next request reloads it.
      # Set IDLE_TIMEOUT_MINUTES to 0 to keep the worker warm indefinitely.
      NPEC_ISOLATE_INFERENCE: "true"
      NPEC_INFERENCE_IDLE_TIMEOUT_MINUTES: "5"
      NVIDIA_VISIBLE_DEVICES: "6"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "2021:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - cv5_models:/opt/npec_models
    depends_on:
      - db
      - minio
      - migrations
      - bootstrap

  frontend:
    image: ghcr.io/bredauniversityadsai/2025-26d-fai2-adsai-group-computervision5/cv5-frontend:${SERVICE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "2022:3000"
    depends_on:
      - api

  metabase:
    image: metabase/metabase:latest
    container_name: cv5-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabaseappdb
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
    ports:
      - "2024:3000"
    depends_on:
      - db
    healthcheck:
      test: [ "CMD", "curl", "--fail", "-I", "http://localhost:3000/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  cv5_npec_pgdata:
    external: true
    name: cv5_pgdata_prod
  minio_data:
    external: true
    name: cv5_minio_prod
  cv5_models:
    external: true
    name: cv5_models_prod