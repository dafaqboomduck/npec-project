name: root-detection-train
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # TensorFlow with bundled CUDA — no separate CUDA base image needed
      - tensorflow[and-cuda]>=2.15,<2.17
      - keras>=2.15,<3.0
      # Computer vision + data
      - opencv-python-headless>=4.8
      - numpy>=1.24
      - scikit-learn>=1.3
      - tqdm>=4.66
      - matplotlib>=3.7
      # Azure ML experiment tracking
      - mlflow>=2.10
      - azureml-mlflow
      # Azure ML SDK — needed by register_model_if_better.py inside the cluster
      - azure-ai-ml>=1.12
      - azure-identity>=1.15
