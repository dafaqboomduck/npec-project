[project]
name = "npec-cv-deps"
version = "0.1.0"
description = "NPEC project dependencies"
requires-python = ">=3.10.18"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]


[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = [
    "tests/preprocessing",
    "tests/inference",
    "tests/postprocessing",
    "tests/e2e",
    "tests/cli",
    "tests/api",
    "tests/scripts",
    "tests/lineage",
]
markers = [
    "slow: real-inference tests that load TF models (run with `pytest -m slow` or include in default discovery)",
]
asyncio_mode = "auto"
filterwarnings = [
    # Third-party noise we can't fix from here. Matched by message text since
    # the module field matches where the warning is raised, not the import site.
    "ignore:The pynvml package is deprecated.*:FutureWarning",
    "ignore:Using `httpx` with `starlette.testclient`.*",
    "ignore:.*ChangedInMarshmallow4Warning.*",
]
addopts = [
    "-m",
    "not slow",
    "--cov=src/npec_cv",
    "--cov=api/src",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]

[tool.coverage.run]
source = ["src/npec_cv", "api/src"]
branch = true
omit = [
    "*/artifacts/*",
    "*/__init__.py",
    "*/_tf_setup.py",
    "*/helpers/dataset_manager.py",
    # External-system wrappers — cannot be meaningfully unit-tested without
    # live Azure ML / MLflow / GPU. Integration-tested separately.
    "api/src/services/azure_inference.py",
    "api/src/services/azure_training.py",
    "api/src/services/retraining.py",
    "api/src/services/unet_inference.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/inference_manager.py" = ["E402"]
"**/_tf_setup.py" = ["E402"]
"tests/*" = ["D"]
"scripts/*" = ["D", "E"]
"tests/*/conftest.py" = ["E402"]
# Alembic env.py deliberately manipulates sys.path before importing db, so
# imports are not at the top of the file. This is the standard alembic pattern.
"db/alembic/env.py" = ["E402"]
"db/session.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"