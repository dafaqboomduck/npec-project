[project]
name = "npec-cv-deps"
version = "0.1.0"
description = "NPEC project dependencies"
requires-python = ">=3.10.18"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: real-inference tests that load TF models (skipped by default; run with `pytest -m slow` or `pytest -m 'slow or not slow'`)",
]
addopts = "-m 'not slow'"

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/inference_manager.py" = ["E402"]
"**/_tf_setup.py" = ["E402"]
"tests/*" = ["D"]
"tests/*/conftest.py" = ["E402"]
# Alembic env.py deliberately manipulates sys.path before importing db, so
# imports are not at the top of the file. This is the standard alembic pattern.
"db/alembic/env.py" = ["E402"]
"db/session.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["npec_cv"]

[tool.isort]
profile = "black"
known_first_party = ["npec_cv"]

[tool.ruff.lint.pydocstyle]
convention = "google"