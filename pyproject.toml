[project]
name = "npec-cv"
version = "0.1.0"
description = "NPEC plant root segmentation service"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-postgresql>=6.0",
]


[tool.pytest.ini_options]
pythonpath = ["."]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/inference_manager.py" = ["E402"]
"**/_tf_setup.py" = ["E402"]
"tests/*" = ["D"]
"tests/preprocessing/conftest.py" = ["E402"]
# Alembic env.py deliberately manipulates sys.path before importing db, so
# imports are not at the top of the file. This is the standard alembic pattern.
"db/alembic/env.py" = ["E402"]
"db/session.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["npec_cv"]

[tool.isort]
profile = "black"
known_first_party = ["npec_cv"]

[tool.ruff.lint.pydocstyle]
convention = "google"